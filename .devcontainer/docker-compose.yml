services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    environment:
      PAON_ENV: development
      NODE_ENV: development
      BIND: 0.0.0.0
      PORT: 3000
      DB_HOST: db
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: mastodon
      DB_SSLMODE: disable
      REDIS_HOST: redis
      MEILI_ENABLED: 'true'
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: aSampleMasterKey
    command: sleep infinity
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - external_network
      - internal_network

  db:
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mastodon
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      - internal_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - internal_network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: aSampleMasterKey
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - internal_network

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:

networks:
  external_network:
  internal_network:
    internal: true
