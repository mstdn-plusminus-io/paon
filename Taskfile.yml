version: '3'

vars:
  PAON_IMAGE_TAGS:
    sh: |
      if command -v pkg-config >/dev/null 2>&1 && pkg-config --atleast-version=8.16.1 vips; then
        printf libvips
      else
        printf '%s\n' 'level=WARN event=image_processor_fallback processor=libvips fallback=go-native phase=task_build' >&2
      fi

env:
  TMPDIR: '{{.ROOT_DIR}}/.go-tmp'
  GOTMPDIR: '{{.ROOT_DIR}}/.go-tmp'
  GOCACHE: '{{.ROOT_DIR}}/.go-buildcache'
  GOMODCACHE: '{{.ROOT_DIR}}/.go-modcache'
  GOFLAGS: '{{if .PAON_IMAGE_TAGS}}-tags={{.PAON_IMAGE_TAGS}}{{end}}'

tasks:
  dev:
    desc: Build UI assets once, then watch and restart the Go backend alongside Rspack
    deps:
      - dev:assets
    cmds:
      - task --parallel dev:backend dev:frontend

  dev:assets:
    desc: Build development UI assets into public/packs before the backend starts
    preconditions:
      - sh: test -x node_modules/.bin/rspack
        msg: Run yarn install --frozen-lockfile before task dev
    cmds:
      - yarn build:development

  dev:backend:
    desc: Rebuild and gracefully restart Paon when backend files change
    cmds:
      - go run github.com/air-verse/air@v1.65.3 -c .air.toml

  dev:frontend:
    desc: Rebuild development UI assets in public/packs when frontend files change
    preconditions:
      - sh: test -x node_modules/.bin/rspack
        msg: Run yarn install --frozen-lockfile before task dev
    cmds:
      - yarn build:development --watch

  build:
    desc: Build the Paon binaries
    cmds:
      - mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE" bin
      - go build -mod=mod -o bin/paon ./cmd/paon
      - go build -mod=mod -o bin/paon-admin ./cmd/paon-admin
      - go build -mod=mod -o bin/paon-cutover ./cmd/paon-cutover
      - go build -mod=mod -o bin/paon-meili-deploy ./cmd/paon-meili-deploy
      - go build -mod=mod -o bin/paon-migrate ./cmd/paon-migrate

  test:
    desc: Run the Paon test suite
    cmds:
      - mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE"
      - go test -cover -mod=mod ./...

  test:rtk:
    desc: Run the Paon test suite through rtk
    cmds:
      - mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE"
      - rtk go test -mod=mod ./...

  integration:up:
    desc: Start isolated PostgreSQL and Redis integration dependencies
    cmds:
      - docker compose -f docker-compose.integration.yml up -d --wait

  test:integration:
    desc: Run real PostgreSQL and Redis migration, queue, lease, and scheduler tests
    deps:
      - integration:up
    env:
      PAON_TEST_DATABASE_URL: postgres://postgres:paon@127.0.0.1:55432/paon_integration?sslmode=disable
      PAON_TEST_REDIS_URL: redis://127.0.0.1:56379/15
    cmds:
      - go test -mod=mod -tags="{{.PAON_IMAGE_TAGS}} integration" ./cmd/paon-migrate
      - go test -mod=mod -tags="{{.PAON_IMAGE_TAGS}} integration" ./internal/paon/db
      - go test -mod=mod -tags="{{.PAON_IMAGE_TAGS}} integration" ./internal/paon/migrate
      - go test -mod=mod -tags="{{.PAON_IMAGE_TAGS}} integration" ./internal/paon/cutover
      - go test -mod=mod -tags="{{.PAON_IMAGE_TAGS}} integration" ./internal/paon/api

  routes:go:
    desc: Export the registered Go HTTP route manifest
    cmds:
      - mkdir -p tmp
      - go run -mod=mod ./cmd/paon-routes > tmp/go-routes.json

  routes:audit:
    desc: Compare Go routes with a Mastodon 4.5.15 Rails route manifest
    deps:
      - routes:go
    vars:
      RAILS_ROUTES: '{{default "tmp/rails-routes-4.5.15.json" .PAON_RAILS_ROUTE_MANIFEST}}'
    preconditions:
      - sh: test -f "{{.RAILS_ROUTES}}"
        msg: Set PAON_RAILS_ROUTE_MANIFEST to a generated Mastodon 4.5.15 Rails route manifest
    cmds:
      - go run -mod=mod ./cmd/paon-route-audit --rails "{{.RAILS_ROUTES}}" --go tmp/go-routes.json

  test:differential:core:
    desc: Compare public and unauthenticated HTTP contracts against live Rails and Go reference servers
    preconditions:
      - sh: test -n "$PAON_RAILS_REFERENCE_URL"
        msg: PAON_RAILS_REFERENCE_URL is required
      - sh: test -n "$PAON_GO_REFERENCE_URL"
        msg: PAON_GO_REFERENCE_URL is required
    cmds:
      - go run -mod=mod ./cmd/paon-differential --cases testdata/differential/core.json

  test:differential:
    desc: Compare the complete public and seeded authenticated Mastodon 4.5.15 contract matrix
    deps:
      - test:differential:core
    preconditions:
      - sh: test -n "$PAON_DIFF_USER_AUTHORIZATION"
        msg: PAON_DIFF_USER_AUTHORIZATION is required (for example, Bearer plus the seeded user token)
      - sh: test -n "$PAON_DIFF_OWNER_AUTHORIZATION"
        msg: PAON_DIFF_OWNER_AUTHORIZATION is required
      - sh: test -n "$PAON_DIFF_ADMIN_AUTHORIZATION"
        msg: PAON_DIFF_ADMIN_AUTHORIZATION is required
      - sh: test -n "$PAON_DIFF_NO_READ_ACCOUNTS_AUTHORIZATION"
        msg: PAON_DIFF_NO_READ_ACCOUNTS_AUTHORIZATION is required
      - sh: test -n "$PAON_DIFF_LOCAL_ACCOUNT_ID"
        msg: PAON_DIFF_LOCAL_ACCOUNT_ID is required
      - sh: test -n "$PAON_DIFF_REMOTE_ACCOUNT_ID"
        msg: PAON_DIFF_REMOTE_ACCOUNT_ID is required
      - sh: test -n "$PAON_DIFF_SUSPENDED_ACCOUNT_ID"
        msg: PAON_DIFF_SUSPENDED_ACCOUNT_ID is required
      - sh: test -n "$PAON_DIFF_PUBLIC_STATUS_ID"
        msg: PAON_DIFF_PUBLIC_STATUS_ID is required
      - sh: test -n "$PAON_DIFF_PRIVATE_STATUS_ID"
        msg: PAON_DIFF_PRIVATE_STATUS_ID is required
      - sh: test -n "$PAON_DIFF_BLOCKED_STATUS_ID"
        msg: PAON_DIFF_BLOCKED_STATUS_ID is required
      - sh: test -n "$PAON_DIFF_SEARCH_QUERY"
        msg: PAON_DIFF_SEARCH_QUERY is required and must be URL-encoded
      - sh: test -n "$PAON_DIFF_SEARCH_MAX_ID"
        msg: PAON_DIFF_SEARCH_MAX_ID is required
      - sh: test -n "$PAON_DIFF_LINK_URL_QUERY"
        msg: PAON_DIFF_LINK_URL_QUERY is required and must be URL-encoded
      - sh: test -n "$PAON_DIFF_CONTEXT_ID"
        msg: PAON_DIFF_CONTEXT_ID is required (the seeded FEP-7888 account-status context identifier)
      - sh: test -n "$PAON_DIFF_NUMERIC_ACCOUNT_ID"
        msg: PAON_DIFF_NUMERIC_ACCOUNT_ID is required
      - sh: test -n "$PAON_DIFF_NUMERIC_STATUS_ID"
        msg: PAON_DIFF_NUMERIC_STATUS_ID is required
      - sh: test -n "$PAON_DIFF_ACCEPTED_QUOTE_ID"
        msg: PAON_DIFF_ACCEPTED_QUOTE_ID is required
      - sh: test -n "$PAON_DIFF_QUOTED_STATUS_ID"
        msg: PAON_DIFF_QUOTED_STATUS_ID is required
      - sh: test -n "$PAON_DIFF_ACCEPTED_QUOTE_STATUS_ID"
        msg: PAON_DIFF_ACCEPTED_QUOTE_STATUS_ID is required
      - sh: test -n "$PAON_DIFF_QUOTE_POLICY_STATUS_ID"
        msg: PAON_DIFF_QUOTE_POLICY_STATUS_ID is required
      - sh: test -n "$PAON_DIFF_QUOTE_TARGET_STATUS_ID"
        msg: PAON_DIFF_QUOTE_TARGET_STATUS_ID is required
      - sh: test -n "$PAON_DIFF_TOPIC_TAG"
        msg: PAON_DIFF_TOPIC_TAG is required and must be URL-encoded
      - sh: test -n "$PAON_DIFF_USERNAME_BLOCK"
        msg: PAON_DIFF_USERNAME_BLOCK is required and must be a unique ASCII username fragment
      - sh: test -n "$PAON_DIFF_RAILS_USER_COOKIE"
        msg: PAON_DIFF_RAILS_USER_COOKIE is required
      - sh: test -n "$PAON_DIFF_RAILS_USER_CSRF_TOKEN"
        msg: PAON_DIFF_RAILS_USER_CSRF_TOKEN is required
      - sh: test -n "$PAON_DIFF_GO_USER_COOKIE"
        msg: PAON_DIFF_GO_USER_COOKIE is required
      - sh: test -n "$PAON_DIFF_GO_USER_CSRF_TOKEN"
        msg: PAON_DIFF_GO_USER_CSRF_TOKEN is required
      - sh: test -n "$PAON_DIFF_RAILS_ADMIN_COOKIE"
        msg: PAON_DIFF_RAILS_ADMIN_COOKIE is required
      - sh: test -n "$PAON_DIFF_RAILS_ADMIN_CSRF_TOKEN"
        msg: PAON_DIFF_RAILS_ADMIN_CSRF_TOKEN is required
      - sh: test -n "$PAON_DIFF_GO_ADMIN_COOKIE"
        msg: PAON_DIFF_GO_ADMIN_COOKIE is required
      - sh: test -n "$PAON_DIFF_GO_ADMIN_CSRF_TOKEN"
        msg: PAON_DIFF_GO_ADMIN_CSRF_TOKEN is required
    cmds:
      - go run -mod=mod ./cmd/paon-differential --cases testdata/differential/authenticated.json

  integration:down:
    desc: Stop and delete isolated integration dependencies
    cmds:
      - docker compose -f docker-compose.integration.yml down -v

  external:up:
    desc: Start deterministic Meilisearch, S3-compatible, and SMTP test services
    cmds:
      - docker compose -f docker-compose.integration.yml --profile external up -d --wait postgres redis meilisearch minio mailpit
      - docker compose -f docker-compose.integration.yml --profile external run --rm --no-deps minio-setup

  test:external:
    desc: Run real Meilisearch, S3-compatible storage, SMTP, and media-tool tests
    deps:
      - external:up
    env:
      PAON_TEST_MEILI_URL: http://127.0.0.1:57700
      PAON_TEST_MEILI_KEY: paon-integration-master-key
      PAON_TEST_S3_URL: http://127.0.0.1:59000
      PAON_TEST_SMTP_HOST: 127.0.0.1
      PAON_TEST_SMTP_PORT: 51025
      PAON_TEST_MAILPIT_URL: http://127.0.0.1:58025
    cmds:
      - go test -mod=mod -tags="{{.PAON_IMAGE_TAGS}} external" ./internal/paon/api

  run:
    desc: Run the Paon HTTP/worker process from source
    cmds:
      - mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE"
      - go run -mod=mod ./cmd/paon

  check-config:
    desc: Run Paon startup compatibility checks from source
    cmds:
      - mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE"
      - go run -mod=mod ./cmd/paon --check-config

  check-config:bin:
    desc: Run Paon startup compatibility checks with the built binary
    deps:
      - build
    cmds:
      - bin/paon --check-config

  cutover:preflight:
    desc: Refuse Go cutover unless the fenced Rails Sidekiq deployment is fully drained
    cmds:
      - mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE"
      - go run -mod=mod ./cmd/paon-cutover --producer-fenced

  db:migrate:
    desc: Apply or validate the Go-owned Rails-compatible database schema
    cmds:
      - mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE"
      - go run -mod=mod ./cmd/paon-migrate

  meili-deploy:
    desc: Rebuild Rails-compatible Meilisearch indexes from source
    cmds:
      - mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE"
      - go run -mod=mod ./cmd/paon-meili-deploy

  meili-deploy:check-config:
    desc: Validate Meilisearch deploy prerequisites from source
    cmds:
      - mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE"
      - go run -mod=mod ./cmd/paon-meili-deploy --check-config

  meili-deploy:check-config:bin:
    desc: Validate Meilisearch deploy prerequisites with the built binary
    deps:
      - build
    cmds:
      - bin/paon-meili-deploy --check-config

  compose:config:
    desc: Render the Go drop-in Compose configuration
    cmds:
      - docker compose config

  compose:up:
    desc: Start the Go drop-in web and worker services
    cmds:
      - docker compose up web worker

  compose:check-config:
    desc: Validate the Go drop-in Compose runtime
    cmds:
      - docker compose run --rm web paon --check-config

  compose:db-migrate:
    desc: Initialize or validate the schema using the Go migration binary
    cmds:
      - docker compose --profile setup run --rm db-migrate

  compose:meili-deploy:
    desc: Rebuild Meilisearch indexes inside the Go Compose runtime
    cmds:
      - docker compose run --rm web paon-meili-deploy

  compose:meili-deploy:check-config:
    desc: Validate Meilisearch deploy prerequisites inside Compose
    cmds:
      - docker compose run --rm web paon-meili-deploy --check-config
