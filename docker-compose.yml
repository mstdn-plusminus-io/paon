# web, worker and one-shot Go children receive OTEL_* (including credential
# headers) through .env.production. They are intentionally not duplicated in
# environment below, because empty Compose interpolation would shadow env_file.
services:
  db:
    restart: always
    image: postgres:14-alpine
    shm_size: 256mb
    networks:
      - internal_network
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ${DB_NAME:-mastodon}
      POSTGRES_USER: ${DB_USER:-postgres}
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USER:-postgres}']
    volumes:
      - ./postgres14:/var/lib/postgresql/data

  redis:
    restart: always
    image: redis:7-alpine
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
    volumes:
      - ./redis:/data

  meilisearch:
    restart: always
    image: getmeili/meilisearch:v1.12
    networks:
      - internal_network
      - external_network
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-aSampleMasterKey}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./meilisearch:/meili_data
    ports:
      - '127.0.0.1:7700:7700'

  web:
    build: .
    image: plusminusio/paon:latest
    restart: always
    env_file:
      - path: .env.production
        required: false
    command: paon
    environment:
      BIND: 0.0.0.0
      PORT: 3000
      PAON_PROCESS_ROLE: web
      PAON_PUBLIC_DIR: /opt/mastodon/public
      DATABASE_URL: ''
      DB_HOST: db
      DB_SSLMODE: disable
      REDIS_URL: ''
      REDIS_HOST: redis
      REDIS_PASSWORD: ''
      MEILI_ENABLED: ${MEILI_ENABLED:-true}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-aSampleMasterKey}
    networks:
      - external_network
      - internal_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider --proxy=off localhost:3000/health/ready || exit 1',
        ]
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./public/system:/opt/mastodon/public/system

  worker:
    build: .
    image: plusminusio/paon:latest
    restart: always
    env_file:
      - path: .env.production
        required: false
    command: paon
    environment:
      PAON_PROCESS_ROLE: worker
      PAON_PUBLIC_DIR: /opt/mastodon/public
      DATABASE_URL: ''
      DB_HOST: db
      DB_SSLMODE: disable
      REDIS_URL: ''
      REDIS_HOST: redis
      REDIS_PASSWORD: ''
      MEILI_ENABLED: ${MEILI_ENABLED:-true}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-aSampleMasterKey}
    networks:
      - external_network
      - internal_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      disable: true
    volumes:
      - ./public/system:/opt/mastodon/public/system

  db-migrate:
    profiles:
      - setup
    build: .
    image: plusminusio/paon:latest
    env_file:
      - path: .env.production
        required: false
    command: paon-migrate
    environment:
      DATABASE_URL: ''
      DB_HOST: db
      DB_SSLMODE: disable
    networks:
      - internal_network
    depends_on:
      db:
        condition: service_healthy

networks:
  external_network:
  internal_network:
    internal: true
